<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusFest</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<header class="site-header">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand header-logo" href="index.html">
          <span class="brand-text">CampusFest</span>
        </a>
        <button class="navbar-toggler border-0 shadow-none d-lg-none p-1" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPublic" aria-controls="navbarPublic" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarPublic">
          <ul class="navbar-nav header-nav-links">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
          </ul>
          <div class="header-right-actions ms-lg-auto d-flex align-items-center">
            <a href="login.html" class="btn btn-header-login active">Login</a>
            <a href="register.html" class="btn btn-header-register">Register</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

<main class="login-wrapper py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="login-card">
            
            <div class="text-center mb-4">
              <h2 class="login-brand">CampusFest</h2>
              <p class="login-subtitle text-muted">Sign in to your institutional account</p>
            </div>

            <div class="role-selector mb-3" role="group" aria-label="Account Type">
              <button type="button" class="btn btn-sm role-toggle-btn active" id="studentRoleBtn" data-role="student">
                <i class="bi bi-mortarboard me-1"></i> Student
              </button>
              <button type="button" class="btn btn-sm role-toggle-btn" id="facultyRoleBtn" data-role="faculty">
                <i class="bi bi-person-workspace me-1"></i> Faculty
              </button>
            </div>

            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

<form id="loginForm" novalidate>
              
              <div class="mb-3">
                <label for="collegeEmail" class="form-label">College Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="collegeEmail" placeholder="Enter your official college mail id" required autocomplete="email">
                </div>
              </div>

<div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
              </div>

<div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label small" for="rememberMe">Remember Me</label>
                </div>
                <a href="#" class="forgot-link small" id="forgotPassLink">Forgot password?</a>
              </div>

<button type="submit" class="btn btn-primary-custom w-100 py-2 sign-in-btn">
                <span>Sign In</span> <i class="bi bi-box-arrow-in-right ms-1"></i>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

<footer class="site-footer mt-auto">
    <div class="container py-4">
      <div class="row align-items-center gy-3">
        <div class="col-md-6 text-center text-md-start">
          <span class="footer-brand">CampusFest</span>
          <p class="footer-tagline text-muted small mt-1 mb-0">© 2026 CampusFest. All Rights Reserved.</p>
        </div>
        <div class="col-md-6">
          <ul class="footer-nav list-inline text-center text-md-end mb-0">
            <li class="list-inline-item"><a href="about.html">Contact Us</a></li>
            <li class="list-inline-item"><a href="events.html">College Portal</a></li>
            <li class="list-inline-item"><a href="about.html">Privacy Policy</a></li>
            <li class="list-inline-item"><a href="about.html">Terms of Service</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
